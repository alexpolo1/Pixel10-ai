name: Bug Report
description: Report a bug with the Pixel10 AI Server
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
  - type: input
    id: device
    attributes:
      label: Device
      description: Which device are you using?
      placeholder: "e.g. Pixel 10 Pro"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: "e.g. Android 16 (API 36)"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: AI Backend
      options:
        - Gemini Nano (ML Kit)
        - MediaPipe (custom model)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant logs from the app or logcat.
      render: shell
